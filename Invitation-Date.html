<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Une invitation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  :root{
    --paper: #f4ede0;
    --paper-edge: #e9dfcc;
    --ink: #2b2420;
    --ink-soft: #6b6155;
    --maroon: #7a2e3a;
    --maroon-deep: #5c2029;
    --line: #cdc2ab;
    --gold: #a9824f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'EB Garamond', serif;
    background: radial-gradient(circle at 50% 20%, #ece3d2 0%, #ddd0b8 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
    mix-blend-mode: multiply;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    height: 100%;
    max-height: 780px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .scene {
    position: absolute;
    inset: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.2,.8,.2,1);
  }

  .scene.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Envelope ---------- */
  .envelope-wrap{
    display:flex; flex-direction:column; align-items:center; gap:22px;
    cursor:pointer;
  }

  .envelope{
    width: 220px;
    height: 150px;
    position: relative;
    filter: drop-shadow(0 18px 30px rgba(60,40,20,0.18));
  }

  .env-body{
    position:absolute; inset:0;
    background: #fbf6ec;
    border: 1px solid var(--line);
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 78px solid #ece0c9;
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(.4,.1,.2,1);
    z-index: 3;
  }

  .envelope.open .env-flap{
    transform: rotateX(165deg);
  }

  .env-seal{
    position:absolute;
    top: 52px; left:50%;
    transform: translateX(-50%);
    width: 46px; height:46px;
    border-radius: 50%;
    background: var(--maroon);
    display:flex; align-items:center; justify-content:center;
    color: #f4ede0;
    font-size: 20px;
    z-index: 4;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    transition: transform 0.3s ease;
  }

  .envelope-wrap:hover .env-seal{ transform: translateX(-50%) scale(1.06); }

  .env-shadow-fold{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 90px;
    background: linear-gradient(to top, rgba(0,0,0,0.03), transparent);
  }

  .touch-label{
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- Card shared ---------- */
  .card{
    background: #fbf7ee;
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 45px rgba(60,40,20,0.16), 0 2px 6px rgba(60,40,20,0.08);
    width: 100%;
    padding: 44px 34px 36px;
    text-align: center;
    position: relative;
  }

  .card::before{
    content:"";
    position:absolute; inset: 10px;
    border: 1px solid rgba(122,46,58,0.15);
    pointer-events:none;
  }

  .eyebrow{
    font-size: 11.5px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .headline{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    color: var(--maroon-deep);
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 6px;
  }

  .subline{
    font-size: 14.5px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 10px 0 26px;
  }

  .btn-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 16px;
    position: relative;
    min-height: 54px;
  }

  .btn{
    font-family: 'EB Garamond', serif;
    font-size: 15.5px;
    padding: 12px 26px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .btn-yes{
    background: var(--maroon);
    border-color: var(--maroon);
    color: #f4ede0;
    letter-spacing: 0.5px;
  }

  .btn-yes:hover{ background: var(--maroon-deep); }
  .btn-yes.grow{ transform: scale(1.08); }

  .btn-no{
    position: relative;
    transition: transform 0.22s ease, left 0.22s ease, top 0.22s ease;
  }

  .taunt{
    margin-top: 18px;
    font-size: 13px;
    font-style: italic;
    color: var(--ink-soft);
    min-height: 18px;
  }

  /* ---------- Details card ---------- */
  .details-title{
    font-size: 18px;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .details-sub{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px;
    letter-spacing: 0.4px;
  }

  .slots{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }

  .slot{
    font-size: 13.5px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s ease;
  }

  .slot:hover{ border-color: var(--maroon); }

  .slot.selected{
    background: var(--maroon);
    border-color: var(--maroon);
    color: #f4ede0;
  }

  .msg-label{
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    margin-bottom: 8px;
  }

  textarea{
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 14.5px;
    color: var(--ink);
    resize: none;
    padding: 4px 2px 10px;
    margin-bottom: 26px;
  }

  textarea:focus{ outline: none; border-color: var(--maroon); }

  .confirm-btn{
    width: 100%;
    background: var(--maroon);
    color: #f4ede0;
    border: none;
    padding: 14px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.18s ease;
  }

  .confirm-btn:disabled{
    background: #cdbdb9;
    cursor: not-allowed;
  }

  .confirm-btn:not(:disabled):hover{ background: var(--maroon-deep); }

  /* ---------- Confirmation ---------- */
  .heart-seal{
    width: 44px; height:44px;
    border-radius:50%;
    background: var(--maroon);
    color:#f4ede0;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .final-line{
    font-size: 13.5px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    .scene, .env-flap, .btn-no, .btn-yes { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- SCENE 1 : Envelope -->
  <div class="scene active" id="scene-envelope">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-shadow-fold"></div>
        <div class="env-flap"></div>
        <div class="env-seal">♥</div>
      </div>
      <div class="touch-label">Touche la lettre</div>
    </div>
  </div>

  <!-- SCENE 2 : Ask -->
  <div class="scene" id="scene-ask">
    <div class="card">
      <p class="eyebrow" id="askEyebrow">Pour toi, Didine</p>
      <h1 class="headline">Ça te dit un date<br>avec moi&nbsp;?</h1>
      <p class="subline" id="askSub">(dire non ne sert à rien, mais tu peux essayer)</p>
      <div class="btn-row" id="askBtnRow">
        <button class="btn btn-no" id="noBtn">Non</button>
        <button class="btn btn-yes" id="yesBtn">Oui</button>
      </div>
      <p class="taunt" id="taunt"></p>
    </div>
  </div>

  <!-- SCENE 3 : Details -->
  <div class="scene" id="scene-details">
    <div class="card">
      <p class="eyebrow">Parfait</p>
      <h1 class="headline">On se retrouve</h1>
      <p class="details-title" id="filmTitle">Au restaurant</p>
      <p class="details-sub" id="cinemaInfo">Carentec</p>
      <p class="details-sub" id="dayInfo">Samedi 8 août</p>

      <div class="slots" id="slots">
        <button class="slot" data-time="11h">11h</button>
        <button class="slot" data-time="11h30">11h30</button>
        <button class="slot" data-time="12h">12h</button>
        <button class="slot" data-time="12h30">12h30</button>
      </div>

      <p class="msg-label">Un mot pour moi (facultatif)</p>
      <textarea id="noteInput" rows="1" placeholder="…"></textarea>

      <button class="confirm-btn" id="confirmBtn" disabled>Confirmer</button>
    </div>
  </div>

  <!-- SCENE 4 : Confirmation -->
  <div class="scene" id="scene-final">
    <div class="card">
      <div class="heart-seal">♥</div>
      <p class="eyebrow">C'est noté</p>
      <h1 class="headline" id="finalDate" style="font-size:28px;">Samedi 8 août à 12h</h1>
      <p class="details-sub" id="finalFilm">Au restaurant · Carentec</p>
      <p class="final-line">J'ai déjà hâte.</p>
    </div>
  </div>

</div>

<script>
  // ---- easily editable config ----
  const RECIPIENT = "Didine";

  const scenes = {
    envelope: document.getElementById('scene-envelope'),
    ask: document.getElementById('scene-ask'),
    details: document.getElementById('scene-details'),
    final: document.getElementById('scene-final'),
  };

  function showScene(name){
    Object.values(scenes).forEach(s => s.classList.remove('active'));
    scenes[name].classList.add('active');
  }

  document.getElementById('askEyebrow').textContent = `Pour toi, ${RECIPIENT}`;

  // ---- envelope open ----
  const envelopeWrap = document.getElementById('envelopeWrap');
  const envelope = document.getElementById('envelope');
  envelopeWrap.addEventListener('click', () => {
    envelope.classList.add('open');
    setTimeout(() => showScene('ask'), 500);
  });

  // ---- "Non" button dodges + taunts ----
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const btnRow = document.getElementById('askBtnRow');
  const askSub = document.getElementById('askSub');
  const taunt = document.getElementById('taunt');

  const taunts = [
    "Vraiment ?",
    "Tu es sûre...",
    "Ça ne sert à rien de dire non...",
    "Bon, allez.",
    "Je n'abandonne pas.",
    "Dernière chance de dire oui !"
  ];
  let dodgeCount = 0;

  function dodgeNo(){
    const rowBox = btnRow.getBoundingClientRect();
    const btnBox = noBtn.getBoundingClientRect();
    const maxX = Math.max(0, rowBox.width - btnBox.width - 8);
    const maxY = 40;
    const x = (Math.random() - 0.5) * maxX;
    const y = (Math.random() - 0.5) * maxY;
    noBtn.style.position = 'relative';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    dodgeCount++;
    taunt.textContent = taunts[Math.min(dodgeCount - 1, taunts.length - 1)];
    yesBtn.classList.add('grow');
    setTimeout(() => yesBtn.classList.remove('grow'), 200);
  }

  noBtn.addEventListener('mouseenter', dodgeNo);
  noBtn.addEventListener('click', (e) => { e.preventDefault(); dodgeNo(); });
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodgeNo(); }, {passive:false});

  yesBtn.addEventListener('click', () => showScene('details'));

  // ---- slot selection ----
  let selectedSlot = null;
  document.querySelectorAll('.slot').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.slot').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSlot = btn.dataset.time;
      confirmBtn.disabled = false;
    });
  });

  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.addEventListener('click', () => {
    if(!selectedSlot) return;
    const dayText = document.getElementById('dayInfo').textContent.trim();
    document.getElementById('finalDate').textContent = `${dayText} à ${selectedSlot}`;
    showScene('final');
  });
</script>

</body>
</html>
